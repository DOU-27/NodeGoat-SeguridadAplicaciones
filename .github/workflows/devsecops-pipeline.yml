name: DevSecOps Pipeline
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sast-semgrep:
    name: "SAST - Semgrep Code Scanning"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      
      - name: Ejecutar Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
          generateSarif: "semgrep-results.sarif"
          
      - name: Subir artefacto SARIF de Semgrep
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif-report
          path: semgrep-results.sarif

  sca-and-sbom:
    name: "SCA & Generación de SBOM"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        
      # 1. Generación del SBOM en Estándar CycloneDX
      - name: Generar SBOM con Syft (CycloneDX JSON)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: "sbom.cyclonedx.json"
          
      - name: Subir artefacto SBOM (CycloneDX)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          
      # 2. Análisis SCA con OWASP Dependency-Check
      - name: OWASP Dependency-Check Scan
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'AppSegura'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 7
            --enableExperimental
            --suppression suppression.xml
            
      - name: Subir Reporte SCA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/